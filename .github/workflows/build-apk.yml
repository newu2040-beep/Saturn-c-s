name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Version string: $JAVA_VER_OUTPUT"
          
          # Extract major version
          if [[ "$JAVA_VER_OUTPUT" =~ \"([0-9]+)(\.|\-) ]]; then
            MAJOR_VERSION="${BASH_REMATCH[1]}"
          elif [[ "$JAVA_VER_OUTPUT" =~ \"1\.([0-9]+) ]]; then
            MAJOR_VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Could not detect Java major version from '$JAVA_VER_OUTPUT'"
            exit 1
          fi
          
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java version $MAJOR_VERSION is lower than required minimum (17)"
            exit 1
          fi
          echo "Java version verification passed ($MAJOR_VERSION >= 17)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Debug Keystore Setup ==="
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore detected."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore confirmed present."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: verify_apk
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at: $EXPECTED_APK"
            echo "Searching within app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file exists but is empty (0 bytes): $EXPECTED_APK"
            exit 1
          fi
          
          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK" 2>/dev/null)
          echo "Verified APK at: $EXPECTED_APK (Size: $APK_SIZE bytes)"
          echo "apk_path=$EXPECTED_APK" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          TEMP_ASSET_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$TEMP_ASSET_DIR"
          
          RAW_REPO_NAME=$(echo "${{ github.repository }}" | awk -F'/' '{print $2}')
          SANITIZED_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr -cd '[:alnum:]._-' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_REPO_NAME" ]; then
            SANITIZED_REPO_NAME="android-app"
          fi
          
          RELEASE_ASSET_NAME="${SANITIZED_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_ASSET_DIR}/${RELEASE_ASSET_NAME}"
          
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$SOURCE_APK" "$DEST_PATH"
          
          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "::error::Failed to prepare non-empty release asset at $DEST_PATH"
            exit 1
          fi
          
          echo "Release asset prepared: $DEST_PATH"
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset is missing or empty at $ASSET_PATH"
            exit 1
          fi
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          cat << 'EOF' > release_notes.md
          ### 📱 Automated Android Debug Build
          
          This is an automatically generated debug APK built by GitHub Actions.
          
          - **Workflow Run Number:** #${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** `${{ github.sha }}`
          - **Build Type:** Debug APK (`app-debug.apk`)
          - **Signing:** Signed with a temporary debug keystore for development & testing.
          
          > ⚠️ **Notice:** This APK is intended for testing and development purposes. It is not a production release for the Google Play Store.
          
          #### 📥 Direct Download
          Download the attached `.apk` file below under **Assets** and install it on your Android device.
          EOF
          
          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest
          
          echo "release_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Build & Release Summary Report ==="
          
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully."
            
            RELEASE_URL=""
            if command -v gh &> /dev/null; then
              RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            else
              RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            fi
            
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Name: $ASSET_NAME"
            
            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "✅ **Debug APK Build:** Succeeded"
              echo "✅ **GitHub Actions Artifact:** Uploaded as \`app-debug-apk\`"
              echo "✅ **GitHub Release:** Published successfully"
              echo ""
              echo "### 📥 Download APK"
              echo "- **Direct Release Page:** [$RELEASE_TAG]($RELEASE_URL)"
              echo "- **Release Asset:** \`$ASSET_NAME\`"
              echo "- **Backup Artifact:** You can also download \`app-debug-apk\` from the Workflow Summary Artifacts section."
            } >> "$GITHUB_STEP_SUMMARY"
            
          else
            echo "::warning::GitHub Release publishing did not complete successfully or was skipped. However, the APK build and artifact upload succeeded."
            echo "The debug APK artifact 'app-debug-apk' is preserved and available in GitHub Actions run artifacts."
            
            {
              echo "## 🚀 Debug APK Build Summary"
              echo ""
              echo "✅ **Debug APK Build:** Succeeded"
              echo "✅ **GitHub Actions Artifact:** Uploaded as \`app-debug-apk\`"
              echo "⚠️ **GitHub Release:** Publishing was unsuccessful or skipped."
              echo ""
              echo "### 📥 Backup Download Available"
              echo "The debug APK was built successfully and is preserved as a GitHub Actions artifact."
              echo "Download **\`app-debug-apk\`** from the Artifacts section at the bottom of this workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
